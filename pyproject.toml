[project]
name = "honeygrid"
version = "2.0.0"
description = "Enterprise Deception Technology & Incident Response Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "watchdog==6.0.0",
    "reportlab==5.0.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3"
]

[tool.vercel]
entrypoint = "honeygrid.server.listener:app"
