[project]
name = "honeygrid"
version = "2.0.0"
description = "Enterprise Deception Technology & Incident Response Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchdog>=4.0.0",
    "reportlab>=4.1.0"
]

[tool.vercel]
entrypoint = "honeygrid.server.listener:app"
